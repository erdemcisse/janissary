services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_ORIGIN: https://${DOMAIN:?DOMAIN is required}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: "production"
      PORT: "9001"
      TRUST_PROXY: "1"
      PUBLIC_ORIGIN: https://${DOMAIN:?DOMAIN is required}
      MAX_CONNECTIONS_PER_IP: "16"
      MAX_CONNECTIONS: "1400"
      DB_PATH: "/app/data/janissary.db"
      TOKEN_SECRET: ${TOKEN_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      AUTH_REDIRECT_URL: ${AUTH_REDIRECT_URL:-}
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "9001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # The static web roots (landing + game client) are baked into the server
    # image and shared read-only with Caddy (ADR 0013 unified-domain hosting).
    volumes_from:
      - server:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
