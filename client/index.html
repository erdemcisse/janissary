    <!-- Phase 8e-25 (D21): the display faces (Reem Kufi, Uncial Antiqua) are
         only used by the game shell after join, so they are NOT preloaded —
         preloading them caused "preloaded but not used" warnings on the
         connect paint. Alegreya 800 and Plex Mono 500 ARE rendered at load
         (the join headline and mono labels), so they were added above. -->
    <!-- Phase 8e-25 (A-006): the medieval skin images (frame + class tiles)
         were preloaded at page load, but nothing consumes them until after
         join — Chrome logged eight "preloaded but not used" warnings and the
         fetch competed with the HUD-critical fonts. They are small same-origin
         webps fetched on first use (the class picker), so the preloads are
         gone. The fonts above stay: the HUD renders them at load. -->
